[package]
name = "hyperserve"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Runs HyperKernels megakernel bundles on B300 GPUs: an OpenAI-compatible DeepSeek-V4.1-Flash server (llm), openpilot driving (drive), Evo 2 DNA generation (dna), Matrix-Game 3.0 video (world), ACT and pi0-FAST robotics (robot) and ESMFold protein folding (fold)"

[workspace]

[dependencies]
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-13000"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1.10"
fancy-regex = "0.16"
unicode-normalization = "0.1.25"
libc = "0.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
ruzstd = "0.8"

[profile.release]
debug = "line-tables-only"
